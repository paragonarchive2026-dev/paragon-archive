<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paragon Flash — Study</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicon-32.png">
  <link rel="stylesheet" href="../_shared/site-kit.css">
  <style>
    .flash-card {
      min-height: 220px; display:flex; align-items:center; justify-content:center; text-align:center;
      padding:28px; border-radius:20px; background:var(--card); border:1px solid var(--border);
      box-shadow:var(--shadow); font-size:clamp(18px,3vw,26px); font-weight:700; cursor:pointer;
      user-select:none;
    }
    .flash-card .hint { position:absolute; opacity:0.5; font-size:12px; font-weight:600; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a class="brand-link" href="../../paragon-archive.html?site=Paragon%20Flash">
        <img class="brand-logo" src="../../assets/site-icons/paragon-flash.png" alt="">
        <span class="brand-name">Paragon Flash</span>
      </a>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="app.html" class="nav-link">Decks</a>
      <a href="study.html" class="nav-link active">Study</a>
    </nav>
    <div class="header-actions"><button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle theme">◐</button></div>
  </header>
  <main class="page" style="max-width:640px">
    <h1 class="page-title">Study</h1>
    <p class="page-sub">Pick a deck, flip cards, mark known/again. Stats are real and local.</p>
    <div class="field"><label for="studyDeck">Deck</label><select id="studyDeck"></select></div>
    <div class="actions" style="margin-bottom:16px">
      <button type="button" class="btn btn-primary" id="startStudy">Start / shuffle</button>
      <button type="button" class="btn btn-secondary" id="flipCard">Flip</button>
    </div>
    <div id="studyEmpty" class="empty"><strong>No cards to study</strong>Create a deck with cards first.</div>
    <div id="studyArea" hidden>
      <div class="muted" id="studyMeta" style="margin-bottom:10px"></div>
      <div class="flash-card" id="flashFace" tabindex="0">Tap to flip</div>
      <div class="actions" style="margin-top:16px;justify-content:center">
        <button type="button" class="btn btn-danger" id="againBtn">Again</button>
        <button type="button" class="btn btn-primary" id="knownBtn">Known</button>
      </div>
    </div>
  </main>
  <footer class="footer"><p><a href="app.html">Decks</a></p></footer>
  <script src="../_shared/site-kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
