<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paragon Meal — Planner</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicon-32.png">
  <link rel="stylesheet" href="../_shared/site-kit.css">
  <style>
    .meal-grid { display:grid; grid-template-columns:repeat(7,minmax(110px,1fr)); gap:8px; overflow-x:auto; }
    .meal-day { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px; min-width:110px; }
    .meal-day h3 { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-muted); margin-bottom:8px; }
    .meal-day textarea { min-height:70px; font-size:12.5px; margin-bottom:6px; }
    @media (max-width:900px){ .meal-grid{ grid-template-columns:repeat(2,1fr);} }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a class="brand-link" href="../../paragon-archive.html?site=Paragon%20Recipe" title="Meal planner pairs with Paragon Recipe in the Archive">
        <img class="brand-logo" src="../../assets/site-icons/paragon-recipe.png" alt="">
        <span class="brand-name">Paragon Meal</span>
      </a>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="app.html" class="nav-link active">Planner</a>
      <a href="shop.html" class="nav-link">Shopping</a>
    </nav>
    <div class="header-actions"><button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle theme">◐</button></div>
  </header>
  <main class="page">
    <h1 class="page-title">Weekly planner</h1>
    <p class="page-sub">What to eat and when. Use <a href="../recipe-creator/index.html" style="color:var(--accent-2);font-weight:700">Paragon Recipe</a> for full recipes. Not a calorie/macro coach.</p>
    <div id="msg" class="notice" hidden></div>
    <div class="actions" style="margin-bottom:14px">
      <button type="button" class="btn btn-primary" id="saveWeek">Save week</button>
      <button type="button" class="btn btn-secondary" id="clearWeek">Clear week</button>
      <button type="button" class="btn btn-outline" id="toShop">Build shopping list from meals</button>
    </div>
    <div class="meal-grid" id="mealGrid"></div>
  </main>
  <footer class="footer"><p><a href="../../paragon-archive.html?site=Paragon%20Recipe">Related: Paragon Recipe in Archive</a></p></footer>
  <script src="../_shared/site-kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
