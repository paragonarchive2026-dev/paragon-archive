<!--
  PARAGON ARCHIVE — EXPORT IDENTITY
  REAL FILE NAME: app.html
  EXPECTED PROJECT PATH: /sites/photo-editor/app.html
  ROLE: Paragon Photo on-device canvas editor — crop, filters, text, collages tips.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paragon Photo — Editor</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicon-32.png">
  <link rel="stylesheet" href="../_shared/site-kit.css">
  <style>
    #photoCanvas { max-width:100%; border-radius:12px; border:1px solid var(--border); background:#111; display:block; margin:0 auto; cursor:crosshair; }
    .tool-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a class="brand-link" href="../../paragon-archive.html?site=Paragon%20Photo">
        <img class="brand-logo" src="../../assets/site-icons/paragon-photo.png" alt="">
        <span class="brand-name">Paragon Photo</span>
      </a>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="app.html" class="nav-link active">Editor</a>
    </nav>
    <div class="header-actions"><button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle theme">◐</button></div>
  </header>
  <main class="page">
    <h1 class="page-title">Editor</h1>
    <p class="page-sub">Crop, filters, adjustments, text overlay, rotate/flip, export JPG/PNG/WebP. HEIC needs conversion first (see Paragon Files guide). Processing stays on device.</p>
    <div id="msg" class="notice" hidden></div>
    <div class="split">
      <div class="panel">
        <div class="field"><label for="photoFile">Load photo</label><input id="photoFile" type="file" accept="image/*"></div>
        <div class="field"><label for="bright">Brightness (<span id="brightV">0</span>)</label><input id="bright" type="range" min="-100" max="100" value="0"></div>
        <div class="field"><label for="contrast">Contrast (<span id="contrastV">0</span>)</label><input id="contrast" type="range" min="-100" max="100" value="0"></div>
        <div class="field"><label for="saturate">Saturation (<span id="satV">0</span>)</label><input id="saturate" type="range" min="-100" max="100" value="0"></div>
        <div class="field"><label for="filter">Filter preset</label>
          <select id="filter">
            <option value="none">None</option>
            <option value="warm">Warm</option>
            <option value="cool">Cool</option>
            <option value="mono">Mono</option>
            <option value="fade">Fade</option>
            <option value="vivid">Vivid</option>
            <option value="sepia">Sepia</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label for="rotate">Rotate</label>
            <select id="rotate"><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select>
          </div>
          <div class="field"><label for="flip">Flip</label>
            <select id="flip"><option value="none">None</option><option value="h">Horizontal</option><option value="v">Vertical</option></select>
          </div>
        </div>
        <div class="field"><label for="textOverlay">Text overlay</label><input id="textOverlay" placeholder="Optional caption"></div>
        <div class="field-row">
          <div class="field"><label for="textSize">Text size</label><input id="textSize" type="number" min="12" max="120" value="28"></div>
          <div class="field"><label for="textColor">Text color</label><input id="textColor" type="color" value="#ffffff"></div>
        </div>
        <div class="field"><label>Crop (drag on canvas) · <button type="button" class="btn btn-sm btn-outline" id="applyCrop">Apply crop</button> <button type="button" class="btn btn-sm btn-outline" id="clearCrop">Clear</button></label></div>
        <div class="field"><label for="outFmt">Export format</label>
          <select id="outFmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="exportPhoto">Download</button>
          <button type="button" class="btn btn-secondary" id="resetPhoto">Reset adjustments</button>
        </div>
      </div>
      <div class="panel">
        <canvas id="photoCanvas" width="640" height="400"></canvas>
        <p class="muted" style="margin-top:8px;font-size:12px" id="photoMeta">No image loaded</p>
      </div>
    </div>
  </main>
  <footer class="footer"><p><a href="../../paragon-archive.html?site=Paragon%20Photo">Archive detail</a></p></footer>
  <script src="../_shared/site-kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
