<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paragon Travel — Trips</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/brand/favicon-32.png">
  <link rel="stylesheet" href="../_shared/site-kit.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a class="brand-link" href="../../paragon-archive.html?site=Paragon%20Travel">
        <img class="brand-logo" src="../../assets/site-icons/paragon-travel.png" alt="">
        <span class="brand-name">Paragon Travel</span>
      </a>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="app.html" class="nav-link active">Trips</a>
      <a href="pack.html" class="nav-link">Packing</a>
    </nav>
    <div class="header-actions"><button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle theme">◐</button></div>
  </header>
  <main class="page">
    <h1 class="page-title">Trips</h1>
    <p class="page-sub">Plan itineraries and budgets. This app does not book flights or hotels.</p>
    <div class="notice warn">Boundary: no payments, no live flight/hotel search APIs in v1 — planning only.</div>
    <div id="msg" class="notice" hidden></div>
    <div class="split">
      <div class="panel">
        <h2 class="panel-title">Trip editor</h2>
        <input type="hidden" id="tripId">
        <div class="field-row">
          <div class="field"><label for="tripTitle">Title</label><input id="tripTitle" placeholder="Lagos weekend"></div>
          <div class="field"><label for="tripDest">Destination</label><input id="tripDest"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="tripStart">Start</label><input id="tripStart" type="date"></div>
          <div class="field"><label for="tripEnd">End</label><input id="tripEnd" type="date"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="tripBudget">Budget amount</label><input id="tripBudget" type="number" min="0" step="0.01" value="0"></div>
          <div class="field"><label for="tripCur">Currency</label><input id="tripCur" value="NGN" maxlength="3"></div>
        </div>
        <div class="field"><label for="tripDays">Itinerary (one day/line)</label><textarea id="tripDays" rows="6" placeholder="Day 1: Arrive, check-in&#10;Day 2: Museum + dinner"></textarea></div>
        <div class="field"><label for="tripNotes">Notes / entry checklist</label><textarea id="tripNotes" rows="3" placeholder="Visa? vaccines? ETIAS?"></textarea></div>
        <div class="field"><label for="entryCountry">Entry helper country</label><input id="entryCountry" placeholder="e.g. Schengen, UK, USA, Nigeria"></div>
        <button type="button" class="btn btn-outline btn-sm" id="entryCheck" style="margin-bottom:12px">Build entry checklist</button>
        <div id="entryOut" class="muted" style="margin-bottom:12px"></div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="saveTrip">Save trip</button>
          <button type="button" class="btn btn-secondary" id="newTrip">Clear</button>
        </div>
      </div>
      <div class="panel">
        <h2 class="panel-title">Saved trips</h2>
        <div id="tripList" class="empty"><strong>No trips yet</strong>Create your first plan.</div>
      </div>
    </div>
  </main>
  <footer class="footer"><p><a href="../../paragon-archive.html?site=Paragon%20Travel">Archive detail</a></p></footer>
  <script src="../_shared/site-kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
